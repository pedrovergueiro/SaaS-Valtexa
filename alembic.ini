# Configuração do Alembic.
#
# A URL do banco NÃO fica aqui: vem de valtexa.config (DATABASE_URL), a mesma
# que a aplicação usa. Duas fontes de verdade para o endereço do banco é como se
# migra o banco errado.
#
#   alembic upgrade head          aplica as migrações
#   alembic revision --autogenerate -m "descrição"
#
# A aplicação roda `upgrade head` sozinha no start (valtexa.db.migrate).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
