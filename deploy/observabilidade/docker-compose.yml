# Prometheus + Grafana para a ValTexa — exemplo de desenvolvimento/homologação.
#
#   mkdir -p segredos && printf '%s' "$METRICS_TOKEN" > segredos/metrics_token
#   printf '%s' "$SERVICE_TOKEN" > segredos/ia_token
#   GRAFANA_ADMIN_PASSWORD=... docker compose up -d
#
# A pasta segredos/ está no .gitignore. Nenhuma senha tem padrão aqui: sem
# GRAFANA_ADMIN_PASSWORD o compose recusa subir.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./regras.yml:/etc/prometheus/regras.yml:ro
      - ./segredos:/etc/prometheus/segredos:ro
      - prometheus-dados:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  prometheus-dados:
  grafana-dados:
