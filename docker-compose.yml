# Ambiente completo: API (com o console), worker e Postgres.
#
# O serviço de inferência (VALTEXA-B) fica de fora de propósito: ele precisa de
# GPU e de uma faixa de Python diferente, então tem ciclo de vida próprio.
# Aponte INFERENCE_URL para onde ele estiver.

x-platform-env: &platform-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://valtexa:${POSTGRES_PASSWORD}@db:5432/valtexa
  # Obrigatórios e diferentes entre si: ver .env.example.
  SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
  COMMAND_SIGNING_SECRET: ${COMMAND_SIGNING_SECRET:?defina COMMAND_SIGNING_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://app.valtexa.com.br}
  INFERENCE_URL: ${INFERENCE_URL:-http://host.docker.internal:8000}
  STORAGE_DIR: /app/storage

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valtexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: valtexa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valtexa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *platform-env
      # O drenador roda no serviço worker. Dentro da API, cada réplica drenaria
      # a mesma fila — correto, porque os handlers são idempotentes, mas é
      # trabalho em dobro.
      EVENT_WORKER_IN_API: "false"
    ports:
      - "8080:8080"
    volumes:
      - assets:/app/storage

  worker:
    build: .
    command: ["python", "-m", "valtexa.worker"]
    depends_on:
      # A API aplica as migrações no start; o worker só entra com o esquema
      # pronto.
      api:
        condition: service_healthy
    environment:
      <<: *platform-env
    volumes:
      - assets:/app/storage
    # O HEALTHCHECK da imagem consulta a porta 8080, que o worker não abre.
    healthcheck:
      disable: true

volumes:
  pgdata:
  assets:
